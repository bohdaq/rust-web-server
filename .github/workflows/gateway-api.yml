# Gateway API conformance (#19, spec/GATEWAY_API.md): rws in a kind cluster
# against the official suite at the pinned Gateway API release. Not required
# yet — the claimed profiles and features grow phase by phase; it becomes a
# required check once the core profiles pass.
name: Gateway API conformance

on:
  push:
    branches: [main]
    paths:
      - "src/gateway_api/**"
      - "src/proxy/**"
      - "src/server/**"
      - "helm/**"
      - "ci/e2e/gateway_api*"
      - ".github/workflows/gateway-api.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: gateway-api-${{ github.ref }}
  cancel-in-progress: true

env:
  GATEWAY_API_VERSION: v1.6.3
  KIND_VERSION: v0.33.0
  PROFILES: GATEWAY-HTTP,GATEWAY-GRPC,GATEWAY-TLS,GATEWAY-TCP,GATEWAY-UDP
  # Keep in step with gateway_api::translate::SUPPORTED_FEATURES.
  FEATURES: GRPCRoute,GRPCRouteNamedRouteRule,Gateway,GatewayHTTPListenerIsolation,GatewayInfrastructure,GatewayPort8080,HTTPRoute,HTTPRoute303RedirectStatusCode,HTTPRoute307RedirectStatusCode,HTTPRoute308RedirectStatusCode,HTTPRouteBackendProtocolH2C,HTTPRouteBackendProtocolWebSocket,HTTPRouteBackendRequestHeaderModification,HTTPRouteBackendTimeout,HTTPRouteCORS,HTTPRouteHostRewrite,HTTPRouteMethodMatching,HTTPRouteNamedRouteRule,HTTPRouteParentRefPort,HTTPRoutePathRedirect,HTTPRoutePathRewrite,HTTPRoutePortRedirect,HTTPRouteQueryParamMatching,HTTPRouteRequestMirror,HTTPRouteRequestMultipleMirrors,HTTPRouteRequestPercentageMirror,HTTPRouteRequestTimeout,HTTPRouteResponseHeaderModification,HTTPRouteSchemeRedirect,ListenerSet,ReferenceGrant,TCPRoute,TLSRoute,TLSRouteModeTerminate,UDPRoute

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - name: Build rws with the gateway-api feature
        run: cargo build --bin rws --features gateway-api
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: kind, and the Gateway API suite at the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$KIND_VERSION" --repo kubernetes-sigs/kind --pattern 'kind-linux-amd64' --dir "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
          git clone --depth 1 --branch "$GATEWAY_API_VERSION" https://github.com/kubernetes-sigs/gateway-api "$RUNNER_TEMP/gateway-api"
          gh release download "$GATEWAY_API_VERSION" --repo kubernetes-sigs/gateway-api --pattern standard-install.yaml --dir "$RUNNER_TEMP/gateway-api"
      - name: Conformance suite
        run: ci/e2e/gateway_api.sh target/debug/rws "$RUNNER_TEMP/gateway-api" "$RUNNER_TEMP/report.yaml" "$PROFILES" "$FEATURES"
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.yaml" ]; then
            { echo '```yaml'; cat "$RUNNER_TEMP/report.yaml"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-api-conformance-report
          path: ${{ runner.temp }}/report.yaml
          if-no-files-found: ignore
