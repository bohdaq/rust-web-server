# Three backends (traefik/whoami answers with the pod's hostname and the
# request it got, headers included): rws balances across three upstream
# addresses, so the distribution, ejection and canary splits are visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-a
  labels: {app: whoami, backend: "a"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami, backend: "a"}
  template:
    metadata:
      labels: {app: whoami, backend: "a"}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080", "--name", "backend-a"]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-a
spec:
  selector: {app: whoami, backend: "a"}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
