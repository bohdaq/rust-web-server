[package]
name = "rws-e2e-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Test app for the rws stage end-to-end suite: exercises library-only features of rust-web-server."
license = "MIT"

# Standalone: not a member of the repository workspace.
[workspace]

[[bin]]
name = "rws-e2e-app"
path = "src/main.rs"

[dependencies]
rust-web-server = { path = "../../..", features = [
    "http3",
    "serde",
    "auth",
    "auth-asymmetric",
    "csrf",
    "sso",
    "sso-server",
    "jobs",
    "mailer",
    "webhook",
    "openapi",
    "tera",
    "model-postgres",
    "storage-s3",
    "macros",
] }
# Same versions rws uses, so the types unify (VerifyingKey, Hmac).
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
aws-lc-rs = "1"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
