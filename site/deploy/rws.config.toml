# rws8.tech on bohdan-prod-donotdelete (spec/WEBSITE_REBUILD.md, phase 6).
# One certificate covers every name here, including mail.rws8.tech, which
# postfix and dovecot read from /var/lib/rws (rws-mail-cert.path reloads them).
port               = 443
http_redirect_port = 80
watch              = true
# A directory without an index.html answers 404 instead of a listing (18.8.4).
directory_listing  = false
log_format         = "json"

[acme]
domains = ["rws8.tech", "www.rws8.tech", "rws8.168-119-17-57.sslip.io", "php.168-119-17-57.sslip.io", "mail.rws8.tech"]

[[upstream]]
name     = "php-demo"
backends = ["127.0.0.1:3200"]

# Acme Cloud Portal PHP demo (acme-portal-php.service, FrankenPHP).
[[route]]
  name = "php-demo"

  [route.match]
  host = "php.168-119-17-57.sslip.io"
  path = "/*"

  [route.action]
  type     = "proxy"
  upstream = "php-demo"

  [[route.middleware.rewrite.request]]
  type  = "header_set"
  name  = "X-Forwarded-Proto"
  value = "https"

  [[route.middleware.rewrite.request]]
  type  = "header_set"
  name  = "X-Forwarded-Host"
  value = "php.168-119-17-57.sslip.io"

[[upstream]]
name     = "docs-mcp"
backends = ["127.0.0.1:7890"]

# The docs MCP server (rws-docs-mcp.service): exactly /mcp, so the old-docs
# redirect for /mcp/* never catches it. Rate limited per client IP here; the
# server itself only sees 127.0.0.1.
[[route]]
  name = "docs-mcp"

  [route.match]
  host = "rws8.tech"
  path = "/mcp"

  [route.action]
  type     = "proxy"
  upstream = "docs-mcp"

  [route.middleware]
  rate_limit = { max_requests = 120, window_secs = 60 }

# Docs moved under /docs/ (Starlight served them at the site root).

[[route]]
  name = "old-docs-building-apps"
  [route.match]
  path = "/building-apps/*"
  [route.action]
  type = "redirect"
  [route.action.redirect]
  location = "/docs$path"
  status   = 301

