{{- if or .Values.serviceAccount.create .Values.gatewayAPI.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rws.serviceAccountName" . }}
  labels:
    {{- include "rws.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
