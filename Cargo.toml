[package]
name = "rust-web-server"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Single-binary web server and reverse proxy: automatic HTTPS (Let's Encrypt), HTTP/1.1, HTTP/2 and HTTP/3, load balancing, auth and rate limiting, configured in one TOML file. Also a Rust library: routing, middleware, MCP server, ORM, background jobs. No hyper, no Tower; HTTP/2 and HTTP/3 framing via h2 and quinn."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["web-server", "reverse-proxy", "https", "http3", "acme"]
categories = ["network-programming", "web-programming::http-server"]

# Shared by the facade and the crates/ it is split into (spec/WORKSPACE_SPLIT.md):
# all released together at one version. Release bumps edit this `version`.
[workspace.package]
version = "18.28.0"
authors = ["Bohdan Tsap <bohdan.tsap@tutanota.com>"]
repository = "https://github.com/bohdaq/rust-web-server"
homepage = "https://rws8.tech/"
edition = "2021"
rust-version = "1.99"
license = "MIT"

# The split crates, pinned to the shared version: a release bump edits these
# pins together with `version` above.
[workspace.dependencies]
rws-gateway-api = { path = "crates/rws-gateway-api", version = "=18.28.0" }
rws-proxy = { path = "crates/rws-proxy", version = "=18.28.0" }
rws-storage = { path = "crates/rws-storage", version = "=18.28.0" }
rws-wasm-plugin = { path = "crates/rws-wasm-plugin", version = "=18.28.0" }
rws-acme = { path = "crates/rws-acme", version = "=18.28.0" }
rws-tower = { path = "crates/rws-tower", version = "=18.28.0" }
rws-base = { path = "crates/rws-base", version = "=18.28.0" }
rws-http = { path = "crates/rws-http", version = "=18.28.0" }
rws-server = { path = "crates/rws-server", version = "=18.28.0" }

[workspace]
# Previously implicit (no [workspace] table at all — Cargo auto-added
# rws-macros as a member since it's a path dependency of this package).
# rws-wasm-shim depends ON rust-web-server rather than the other way around,
# so it can't be pulled in as a path *dependency* the way rws-macros is —
# it needs an explicit workspace membership instead. See spec/WASM_SHIM.md.
members = ["rws-macros", "rws-wasm-shim", "crates/rws-base", "crates/rws-http", "crates/rws-server", "crates/rws-tower", "crates/rws-acme", "crates/rws-wasm-plugin", "crates/rws-storage", "crates/rws-proxy", "crates/rws-gateway-api"]
# fuzz/ is its own workspace (cargo-fuzz, nightly-only) — see fuzz/README.md.
exclude = ["fuzz", "ci/e2e/grpc", "starters", "site/mcp", "examples/wasm_plugin"]

[lints.rust]
# `cargo fuzz` builds with --cfg fuzzing (see src/lib.rs fuzz_api).
# docs.rs builds with --cfg docsrs (see [package.metadata.docs.rs]).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

[lib]
name = "rust_web_server"
path = "src/lib.rs"

[[bin]]
name = "rws"
path = "src/main.rs"

# Runnable with `cargo run --example <name> --features "..."`; `cargo test
# --all-features` (or with the listed features) also runs their tests.
[[example]]
name = "hello"
required-features = ["http2"]
test = true

[[example]]
name = "tower"
required-features = ["tower"]
test = true

[[example]]
name = "realtime"
required-features = ["http2"]
test = true

[[example]]
name = "rest_api"
required-features = ["http2", "serde"]
test = true

[[example]]
name = "static_site"
required-features = ["http2"]
test = true

[[example]]
name = "reverse_proxy"
required-features = ["http2"]
test = true

[[example]]
name = "sse_ticker"
required-features = ["http2"]
test = true

[[example]]
name = "upload"
required-features = ["http2"]
test = true

[[example]]
name = "mcp_inventory"
required-features = ["macros", "serde", "sso", "openapi"]
test = true

[[example]]
name = "mcp_gateway"
required-features = ["http2"]
test = true

[[example]]
name = "llm_proxy"
required-features = ["http2"]
test = true

[[example]]
name = "mcp_conformance"
required-features = ["http2"]
test = true

[[example]]
name = "a2a_tck"
required-features = ["http2"]
test = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# `cargo binstall rust-web-server` downloads the prebuilt archive that
# .github/workflows/release.yml attaches to each GitHub Release instead of
# compiling. Linux archives are static musl builds; binstall falls back to
# them on glibc hosts automatically.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/rws-{ version }-{ target }{ archive-suffix }"
bin-dir = "rws-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# docs.rs shows every feature's items, each labelled with the features it
# needs (`--cfg docsrs` turns on `doc_cfg` in src/lib.rs). `full` plus the
# features it leaves out on purpose that still build there: `http1` (the
# sync server mode; compiles beside http2) and `pkcs11` (cryptoki loads the
# HSM module at run time, so it builds without one). Not here: `fips` (aws-lc's
# FIPS module needs CMake and Go, and adds no items) and `mimalloc` (only the
# `rws` binary's allocator; no library items). Not `all-features` for those.
[package.metadata.docs.rs]
features = ["full", "http1", "pkcs11"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["http3", "brotli", "zstd"]
http1 = ["dep:ctrlc", "dep:libc", "rws-server/http1", "rws-proxy/http1"]
http2 = ["dep:rcgen", "dep:aws-lc-rs", "dep:h2", "dep:rustls", "dep:tokio-rustls", "dep:tokio", "dep:bytes", "dep:http", "dep:webpki-roots", "dep:libc", "rws-server/http2", "rws-tower?/http2", "rws-acme?/http2", "rws-proxy/http2", "rws-gateway-api?/http2"]
http3 = ["http2", "dep:quinn", "dep:h3", "dep:h3-quinn", "rws-server/http3", "rws-proxy/http3"]
http-client = ["dep:rustls", "dep:webpki-roots", "rws-server/http-client", "rws-storage?/http-client", "rws-proxy/http-client", "rws-gateway-api?/http-client"]
# Content codings besides gzip (18.1.0): `br` (pure Rust) and `zstd` (C
# libzstd, built with the crate). Both are in the default set.
brotli = ["dep:brotli", "rws-http/brotli", "rws-proxy/brotli"]
zstd   = ["dep:zstd", "rws-http/zstd", "rws-proxy/zstd"]
acme   = ["http2", "dep:rcgen", "dep:webpki-roots", "dep:libc", "dep:aws-lc-rs", "rws-server/acme", "dep:rws-acme", "rws-acme?/acme", "rws-proxy/acme"]
fips   = ["http2", "rustls/fips", "rws-http/fips", "rws-server/fips", "rws-proxy/fips"] # FIPS 140-3: aws-lc's validated module (needs CMake + Go to build); TLS uses only FIPS-approved algorithms
pkcs11 = ["http2", "dep:cryptoki", "dep:aws-lc-rs", "rws-server/pkcs11"] # TLS private keys in an HSM / cloud KMS through PKCS#11 (pkcs11: URIs)
serde  = ["dep:serde", "dep:serde_json", "rws-http/serde", "rws-server/serde", "rws-proxy/serde", "rws-gateway-api?/serde"]
auth   = ["dep:hmac", "dep:sha2", "rws-server/auth", "rws-proxy/auth"]
auth-asymmetric = ["auth", "dep:p256", "dep:rand_core", "rws-server/auth-asymmetric"]  # RS256 (in-crate rsa_key) / ES256 (p256) in JwtLayer
macros = ["dep:rws-macros", "rws-server/macros", "rws-proxy/macros"]
# The `rws` binary allocates with mimalloc instead of the system allocator
# (the library never sets a global allocator).
mimalloc = ["dep:mimalloc", "rws-proxy/mimalloc"]
tera   = ["dep:tera", "dep:serde", "dep:serde_json"]
model-sqlite   = ["dep:sqlx", "sqlx/sqlite",   "sqlx/runtime-tokio", "http2", "rws-server/model-sqlite", "rws-proxy/model-sqlite"]
model-postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/runtime-tokio-rustls", "http2", "rws-server/model-postgres", "rws-proxy/model-postgres"]
model-mysql    = ["dep:sqlx", "sqlx/mysql",    "sqlx/runtime-tokio-rustls", "http2", "rws-server/model-mysql", "rws-proxy/model-mysql"]
crypto = ["dep:argon2", "dep:rand_core", "dep:hmac", "dep:sha2", "dep:aes-gcm", "rws-server/crypto"]
csrf   = ["dep:rand_core", "rws-server/csrf"]
mailer = []  # plain SMTP; STARTTLS/SMTPS additionally requires http-client or http2
sso    = ["dep:p256", "dep:sha2", "dep:rand_core", "dep:serde", "dep:serde_json", "http-client", "rws-server/sso", "rws-proxy/sso"]
sso-server = ["sso", "auth", "rws-server/sso-server", "rws-proxy/sso-server"]  # AuthServer: rws as its own OAuth 2.0 token issuer; reuses auth's HS256 build_jwt/verify_jwt (see crates/rws-server/src/sso/server.rs docs for why not RSA/EC)
sso-saml   = ["sso", "rws-server/sso-saml", "rws-proxy/sso-saml"]  # SamlSp: SAML 2.0 Service Provider; no new deps — hand-rolled XML parser, not quick-xml (see crates/rws-server/src/sso/saml/mod.rs docs)
jobs   = []  # in-memory JobQueue; PersistentJobQueue additionally requires a model-* feature
storage-local = ["rws-server/storage-local", "dep:rws-storage", "rws-storage/storage-local"]  # LocalStorage; no new deps
storage-s3    = ["dep:hmac", "dep:sha2", "http-client", "rws-server/storage-s3", "dep:rws-storage", "rws-storage/storage-s3", "rws-proxy/storage-s3"]  # S3Storage; AWS SigV4 via hmac+sha2, no AWS SDK
storage-azure = ["dep:hmac", "dep:sha2", "http-client", "rws-server/storage-azure", "dep:rws-storage", "rws-storage/storage-azure"]  # AzureBlobStorage; Shared Key HMAC signing + Managed Identity, no Azure SDK
storage-gcs   = ["http-client", "dep:aws-lc-rs", "rws-server/storage-gcs", "dep:rws-storage", "rws-storage/storage-gcs"]  # GcsStorage; JSON API, service-account JWTs signed with aws-lc-rs (native), metadata server, no Google SDK
# Opt-in Tower interop (18.7.0, #23): tower layers as rws middleware, tower
# services (tonic) as rws apps, an rws app as a tower service. Adapters only —
# nothing in the default build changes.
tower = ["http2", "dep:tower-service", "dep:tower-layer", "dep:http-body", "dep:http-body-util", "dep:rws-tower", "rws-tower?/tower", "rws-proxy/tower"]
# Kubernetes Gateway API controller (18.8.0, #19, spec/GATEWAY_API.md): kube-rs
# on the aws-lc-rs provider (one rustls provider, as everywhere), and
# k8s-openapi pinned to the oldest Kubernetes it supports, for the widest
# range of clusters.
gateway-api = ["http2", "serde", "dep:kube", "dep:k8s-openapi", "dep:futures-util", "rws-server/gateway-api", "rws-proxy/gateway-api", "dep:rws-gateway-api", "rws-gateway-api?/gateway-api"]
# WasmLayer / [route.middleware.wasm]: middleware as WebAssembly core modules
# (wasmtime + cranelift, no WASI). Off by default (several MB, long compile);
# the release binaries enable it.
wasm-plugins = ["dep:wasmtime", "dep:rws-wasm-plugin", "rws-wasm-plugin?/wasm-plugins", "rws-proxy/wasm-plugins"]
openapi = ["rws-server/openapi", "rws-proxy/openapi"]  # AppWithState::openapi() / AsyncAppWithState::openapi(); no new deps
webhook = ["dep:hmac", "dep:sha2"]  # verify_webhook_signature: GitHub, Shopify, Stripe
rewrite-regex = ["dep:regex", "rws-server/rewrite-regex"]  # RewriteLayer::request_uri_regex_rewrite
secrets = ["dep:hmac", "dep:sha2", "http-client", "rws-server/secrets"]  # secrets::resolve(): vault:// / aws-sm:// / azkv:// reference resolution (Vault, AWS Secrets Manager, Azure Key Vault); reuses storage-s3's SigV4 signer/credential chain and storage-azure's Managed Identity token fetch

# Presets (18.32.0, #96): they only turn on other features, and each builds
# with or without the default set (`default-features = false` gives HTTP/2 +
# TLS without QUIC). Contents and build times:
# docs/src/content/docs/getting-started/installation.md.
# A server-rendered web app: templates, sessions with signed/encrypted cookies
# and CSRF, password hashing, basic/JWT auth, an SQLite ORM, jobs, mail,
# local file storage.
web = ["http2", "serde", "macros", "tera", "auth", "crypto", "csrf", "model-sqlite", "jobs", "mailer", "storage-local"]
# A JSON API: typed handlers and extractors, OpenAPI + Swagger UI, JWT auth
# (HS256, RS256, ES256), an SQLite ORM, background jobs.
api = ["http2", "serde", "macros", "openapi", "auth", "auth-asymmetric", "model-sqlite", "jobs"]
# The reverse proxy / edge server: HTTP/3, automatic HTTPS, compression,
# route auth (basic, JWT, OIDC), regex rewrites, secret references.
proxy = ["http3", "brotli", "zstd", "acme", "auth", "auth-asymmetric", "sso", "rewrite-regex", "secrets"]
# Every feature that builds with a Rust toolchain and a C compiler alone.
# Left out: `fips` (needs CMake and Go), `pkcs11` (only useful with an HSM),
# `http1` (the sync server mode, an alternative to http2 rather than an
# addition) and `mimalloc` (the `rws` binary's allocator, nothing for a
# library).
full = ["http3", "brotli", "zstd", "http-client", "serde", "auth", "auth-asymmetric", "macros", "acme", "tera",
        "model-sqlite", "model-postgres", "model-mysql", "crypto", "csrf", "mailer", "sso", "sso-server", "sso-saml",
        "jobs", "storage-local", "storage-s3", "storage-azure", "storage-gcs", "tower", "gateway-api", "wasm-plugins",
        "openapi", "webhook", "rewrite-regex", "secrets"]

[dependencies]
# The crates the facade is split into (spec/WORKSPACE_SPLIT.md).
rws-base.workspace = true
rws-http.workspace = true
rws-server.workspace = true
rws-gateway-api = { workspace = true, optional = true }
rws-proxy.workspace = true
rws-storage = { workspace = true, optional = true }
rws-wasm-plugin = { workspace = true, optional = true }
rws-acme = { workspace = true, optional = true }
rws-tower = { workspace = true, optional = true }
ctrlc = { version = "3", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false, features = ["v3"] }
libc = { version = "0.2", optional = true }
file-ext = "12.0.0"
flate2 = "1"
brotli = { version = "9", optional = true }
zstd = { version = "0.14.3", optional = true }  # >= 0.14.3: RUSTSEC-2026-0391
url-search-params = "12.0.0"
url-build-parse = "12.1.0"
# Byte searches on the per-request header path (CR/LF checks, line splits).
memchr = "2.7"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "signal", "time"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
h2 = { version = "0.4", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
tower-service = { version = "0.3.3", optional = true }
tower-layer = { version = "0.3.3", optional = true }
http-body = { version = "1.1", optional = true }
http-body-util = { version = "0.1.5", optional = true }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"], optional = true }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32", "std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
wasmtime = { version = "49.0", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"], optional = true }
# Not quinn's default "rustls-ring": two rustls crypto providers in one build
# make rustls::ClientConfig::builder() panic ("Could not automatically
# determine the process-level CryptoProvider") for every outbound TLS client.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
hmac  = { version = "0.12", optional = true }
sha2  = { version = "0.10", features = ["oid"], optional = true }
p256      = { version = "0.14", features = ["ecdsa"], optional = true }
rws-macros = { path = "rws-macros", version = "17.29", optional = true }
tera = { version = "1", optional = true }
sqlx = { version = "0.8", default-features = false, optional = true }
argon2    = { version = "0.5", features = ["password-hash"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
aes-gcm   = { version = "0.10", optional = true }
regex     = { version = "1", optional = true }
cryptoki  = { version = "0.12", optional = true }

[dev-dependencies]
# rws-server's test helpers (MockTcpStream, credential env locks, …).
rws-server = { workspace = true, features = ["test-support"] }
# test-util: tokio::time::pause for timeout tests (crates/rws-server/src/server/http1_async.rs).
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

# rustls's own "aws-lc-rs" crypto-backend feature compiles C/asm (aws-lc-sys)
# that doesn't build for wasm32-wasip2 — moved to a native-only target table
# so enabling `http-client` (and therefore `sso`/`secrets`/`storage-s3`/
# `storage-azure`) doesn't drag in a dependency that can't compile for wasm32.
# TLS itself still works there — the host performs it via `outgoing-handler`
# (see the #[cfg(target_arch = "wasm32")] send_once in crates/rws-server/src/http_client/mod.rs)
# instead of rustls. http2/http3/acme (which also use rustls) were already
# unsupported on wasm32 regardless, since tokio's rt-multi-thread requires
# real OS threads.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Self-signed certificates for the in-process HTTP/3 test (crates/rws-server/src/h3_handler/tests.rs).
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# RSA keys and signatures for tests of rsa_key (crates/rws-server/src/rsa_key/test_support.rs).
aws-lc-rs = "1"
# Real Tower layers and a real tonic service for the `tower` adapters
# (crates/rws-tower/src/tower/tests.rs, examples/tower.rs). tonic pinned with no default
# features: tonic-health only needs its generated-code support, not hyper.
tower-http = { version = "0.7.1", default-features = false, features = ["set-header", "validate-request", "timeout"] }
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = { version = "=0.14.6", default-features = false }
tonic-health = { version = "=0.14.6", default-features = false }
# A fake Kubernetes API server for the gateway-api controller's tests
# (crates/rws-gateway-api/src/gateway_api/controller/tests.rs): kube's Client takes any tower Service.
tower = { version = "0.5", default-features = false, features = ["util"] }
# WebAssembly text modules for the wasm-plugins tests (crates/rws-wasm-plugin/src/wasm_plugin/tests.rs).
wat = "1"
http-body-util = "0.1.5"
bytes = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webpki-roots = { version = "1.0.11", optional = true }
# acme (TLS-ALPN-01 certificates) and storage-gcs (service-account JWTs).
aws-lc-rs = { version = "1", optional = true }
# prefer-post-quantum (a rustls default): X25519MLKEM768 ranks first, so a
# client offering the hybrid gets it rather than plain X25519.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "tls12", "logging", "std", "prefer-post-quantum"], optional = true }

# wasm32-wasip2 outbound HTTP backend for http_client::Client::send() — see
# the #[cfg(target_arch = "wasm32")] send_once in crates/rws-server/src/http_client/mod.rs and
# spec/WASM_SHIM.md Phase 2 item 7. Native builds never see this dependency.
# `rws --windows-service=<dir>`: run under the Service Control Manager (src/main.rs).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "2.0"
