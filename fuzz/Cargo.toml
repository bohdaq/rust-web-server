[package]
name = "rust-web-server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rust-web-server = { path = "..", default-features = false, features = ["auth", "sso-saml", "http2", "acme", "wasm-plugins"] }

# Separate workspace: the root workspace excludes fuzz/.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

