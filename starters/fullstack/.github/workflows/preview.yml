# Every pull request gets its own copy of the app in vars.KUBE_DC_PREVIEW_NAMESPACE,
# named <app>-pr-<number>, with its URL in the PR's deployments. Closing the PR
# removes it. With vars.KUBE_DC_PREVIEW_DATABASE each preview gets a fresh
# database of its own; otherwise it keeps notes in memory.
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write   # keyless sign-in to kube-dc
  packages: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One environment for every PR: keyless sign-in matches its name exactly
    # (subject ...:environment:preview); each run still reports its own URL.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          base=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-\n' '-' | cut -c1-30 | sed 's/^-*//; s/-*$//')
          echo "app=$base-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - name: Sign in to kube-dc
        env:
          KUBE_DC_API_SERVER: ${{ vars.KUBE_DC_API_SERVER }}
          KUBE_DC_TOKEN_URL: ${{ vars.KUBE_DC_TOKEN_URL }}
          # Keyless when vars.KUBE_DC_AUDIENCE is set (machine identity with spec.github),
          # otherwise the client secret.
          KUBE_DC_AUDIENCE: ${{ vars.KUBE_DC_AUDIENCE }}
          KUBE_DC_CLIENT_ID: ${{ vars.KUBE_DC_PREVIEW_CLIENT_ID || secrets.KUBE_DC_CLIENT_ID }}
          KUBE_DC_CLIENT_SECRET: ${{ secrets.KUBE_DC_CLIENT_SECRET }}
          KUBE_DC_CA_CERT: ${{ secrets.KUBE_DC_CA_CERT }}
        run: deploy/kubeconfig.sh
      - name: Remove the preview
        if: github.event.action == 'closed'
        env:
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          app="${{ steps.names.outputs.app }}"
          kubectl -n "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" delete deployment,service "$app" --ignore-not-found
          # A preview database and its credentials, when it has one; its data
          # is destroyed only once the deletion is confirmed by name.
          for db in $(kubectl -n "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" get managedservice -l "preview.kube-dc.com/name=$app" -o name); do
            kubectl -n "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" annotate --overwrite "$db" "services.kube-dc.com/confirm-delete=${db#*/}"
          done
          kubectl -n "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" delete servicebinding,managedservice -l "preview.kube-dc.com/name=$app" --ignore-not-found --wait=false
          # A pull Secret exists only for private images.
          if [ -n "$PULL_TOKEN" ]; then
            kubectl -n "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" delete secret "$app-pull" --ignore-not-found
          fi
      - if: github.event.action != 'closed'
        uses: docker/setup-buildx-action@v3
      - if: github.event.action != 'closed'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event.action != 'closed'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.image }}
          # Links the package to this repository (and its visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        if: github.event.action != 'closed'
        env:
          PULL_USER: ${{ github.repository_owner }}
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DB_SECRET: none
          # A plan such as postgresql-development gives every preview a fresh, empty
          # database of its own, removed with the preview.
          PREVIEW_DATABASE: ${{ vars.KUBE_DC_PREVIEW_DATABASE }}
          # kube-dc removes the preview after 72 hours without a deploy, or once
          # GitHub reports the pull request closed, even if this workflow's
          # cleanup on close does not run.
          PREVIEW_HOURS: "72"
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: deploy/deploy.sh "${{ vars.KUBE_DC_PREVIEW_NAMESPACE }}" "${{ steps.names.outputs.app }}" "${{ steps.names.outputs.image }}"
