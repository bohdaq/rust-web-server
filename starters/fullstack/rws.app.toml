# The app manifest: the app's name, and where its parts live. Absent keys
# are the conventional layout (src/main.rs, src/lib.rs, src/routes,
# src/models, src/jobs, migrations, templates, tests, static); this app
# serves the built frontend instead of static/. The dev MCP endpoint's
# `layout` tool reads this file.
[app]
name = "{{project-name}}"

[paths]
static = "frontend/dist"   # built by `cd frontend && npm run build`
