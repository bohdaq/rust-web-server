[package]
name = "rws-base"
description = "The base layer of rust-web-server (internal: use the rust-web-server crate)."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
file-ext = "12.0.0"
url-search-params = "12.0.0"
url-build-parse = "12.1.0"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

# docs.rs shows every feature's items, each labelled with the features it
# needs (`--cfg docsrs` turns on `doc_cfg` in lib.rs). No features.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
