[package]
name = "rws-k8s"
description = "Kubernetes integration and operator framework of rust-web-server (kube). (internal: use the rust-web-server crate)."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

[package.metadata.docs.rs]
features = ["k8s"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["k8s"]
# The client and leader election only (what the Gateway API controller uses).
leader = ["dep:kube", "dep:k8s-openapi", "dep:tokio"]
# serde for this crate's types. Also a feature so that `--features serde` at
# the workspace root (cargo-auditable passes the binary's features to
# `cargo metadata`) doesn't fail on the optional `serde` dependency.
serde = ["dep:serde", "dep:serde_json"]
# Everything.
k8s = ["leader", "serde", "kube?/runtime", "kube?/derive", "kube?/admission", "kube?/jsonpatch", "k8s-openapi?/schemars", "dep:futures-util", "dep:schemars", "dep:rcgen", "dep:json-patch", "rws-server/http2", "rws-server/serde"]

[dependencies]
rws-server.workspace = true
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"], optional = true }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32", "std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
schemars = { version = "1", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"], optional = true }
json-patch = { version = "4", optional = true }

[dev-dependencies]
rws-server = { workspace = true, features = ["test-support"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pki-types = "1"
