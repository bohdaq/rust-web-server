[package]
name = "rws-storage"
description = "Object storage for rust-web-server: local files, S3, Azure Blob and Google Cloud Storage backends. (internal: use the rust-web-server crate)."
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)', 'cfg(docsrs)'] }

# docs.rs shows every feature's items, each labelled with the features it
# needs (`--cfg docsrs` turns on `doc_cfg` in lib.rs). Every feature but
# `test-support` (test helpers, not API).
[package.metadata.docs.rs]
features = ["http-client", "storage-azure", "storage-gcs", "storage-local", "storage-s3"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
# Test helpers rust-web-server's own tests use.
test-support = []
http-client = ["rws-server/http-client"]
storage-azure = ["dep:hmac", "dep:sha2", "http-client", "rws-server/storage-azure"]
storage-gcs = ["http-client", "dep:aws-lc-rs", "rws-server/storage-gcs"]
storage-local = ["rws-server/storage-local"]
storage-s3 = ["dep:hmac", "dep:sha2", "http-client", "rws-server/storage-s3"]

[dependencies]
rws-server.workspace = true
http = { version = "1", optional = true }
hmac  = { version = "0.12", optional = true }
sha2  = { version = "0.10", features = ["oid"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = { version = "1", optional = true }

[dev-dependencies]
rws-server = { workspace = true, features = ["test-support"] }
